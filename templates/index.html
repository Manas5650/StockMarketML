<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Price Predictor</title>

  <!-- (Optional) Bootstrap – internet connected ho to use hoga -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root { --brand:#2563eb; --bg:#0b1220; --card:#111827; --muted:#94a3b8; }
    body{ background:#f6f8fb; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; }
    .wrap{ max-width:780px; margin:48px auto; padding:0 16px; }
    .card{
      background:#fff; border:1px solid #e5e7eb; border-radius:16px;
      box-shadow:0 10px 30px rgba(2,6,23,.06); padding:28px;
    }
    .title{ font-weight:700; font-size:26px; margin-bottom:8px; }
    .subtitle{ color:#6b7280; margin-bottom:24px; }
    .form-label{ font-weight:600; color:#111827; }
    .btn-primary{ background:var(--brand); border-color:var(--brand); }
    .btn-primary:hover{ filter:brightness(.95); }
    .result{
      margin-top:18px; padding:16px; border-radius:12px;
      background:#eef2ff; border:1px dashed #c7d2fe; color:#1e3a8a;
      font-weight:700; font-size:18px; display:none;
    }
    .error{
      margin-top:14px; padding:12px; border-radius:10px;
      background:#fee2e2; color:#7f1d1d; border:1px solid #fecaca; display:none;
    }
    .spinner{ display:none; margin-left:10px; width:18px; height:18px;
      border:3px solid #c7d2fe; border-top-color:#1d4ed8; border-radius:50%;
      animation:spin .9s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg)} }
    .hint{ color:#6b7280; font-size:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title">📈 Stock Price Predictor</div>
      <div class="subtitle">Enter OHLC + Volume and get predicted <b>Close</b> price.</div>

      <form id="predictForm" class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="open">Open</label>
          <input class="form-control" id="open" type="number" step="any" placeholder="e.g. 100" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="high">High</label>
          <input class="form-control" id="high" type="number" step="any" placeholder="e.g. 105" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="low">Low</label>
          <input class="form-control" id="low" type="number" step="any" placeholder="e.g. 95" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="volume">Volume</label>
          <input class="form-control" id="volume" type="number" step="1" placeholder="e.g. 2000000" required>
          <div class="hint">Use whole numbers for volume (no commas).</div>
        </div>

        <div class="col-12 d-flex align-items-center">
          <button id="btn" class="btn btn-primary" type="submit">Predict</button>
          <div class="spinner" id="spin"></div>
        </div>
      </form>

      <div id="result" class="result"></div>
      <div id="error" class="error"></div>
    </div>
  </div>

  <script>
  const form = document.getElementById('predictForm');
  const resultEl = document.getElementById('result');
  const errorEl  = document.getElementById('error');
  const btn = document.getElementById('btn');
  const spin = document.getElementById('spin');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    resultEl.style.display = 'none';
    errorEl.style.display = 'none';
    btn.disabled = true; spin.style.display = 'inline-block';

    const payload = {
      open:   parseFloat(document.getElementById('open').value),
      high:   parseFloat(document.getElementById('high').value),
      low:    parseFloat(document.getElementById('low').value),
      volume: parseFloat(document.getElementById('volume').value)
    };

    try {
      // use absolute URL to be safe
      const res = await fetch('/predict', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });

      const text = await res.text();    // read as text first
      let data;
      try { data = JSON.parse(text); }  catch { throw new Error(text); }

      if (!res.ok || data.error) throw new Error(data.error || 'Server error');

      resultEl.innerHTML = `Predicted Close Price: <span style="font-size:22px;">${Number(data.prediction).toFixed(2)}</span>`;
      resultEl.style.display = 'block';
    } catch (err) {
      errorEl.textContent = err.message || 'Failed to fetch';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false; spin.style.display = 'none';
    }
  });
    </script>
</body>
</html>
